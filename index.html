<style>
  :root{

    --card:#ffffff;

  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171310;
      --card:#221d18;
      --ink:#f2ece1;
      --ink-soft:#b8ad9c;
      --accent:#e2825f;
      --accent-soft:#c96a4f;

    --bg:#171310;
    --card:#221d18;
    --ink:#f2ece1;
    --ink-soft:#b8ad9c;
    --accent:#e2825f;
    --accent-soft:#c96a4f;

    justify-content:center;

  .wrap{

  }
  header{
    text-align:center;
    margin-bottom:28px;
  }
  .brand{
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight:600;
  }
  h1{
    font-size:32px;
    margin:6px 0 4px;
    letter-spacing:0.5px;
  }
  .tagline{
    color:var(--ink-soft);
    font-size:14px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .controls{

  }
  .streak{

    color:var(--ink-soft);

  }

  .card{
    background:var(--card);
    border-radius:18px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    padding:28px 24px 24px;
    margin-bottom:18px;
  }

    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:12px;
    letter-spacing:1.5px;

    font-weight:700;
    margin-bottom:8px;

    margin:0 0 14px;

  .body strong{ color:var(--accent); }

  .questions{
    margin-top:6px;
  }
  .questions-title{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;

    margin-bottom:10px;
    font-size:15.5px;
    line-height:1.55;
  }
  .q .num{
    flex:0 0 auto;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin-top:2px;
  }

  .nav{
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .nav button{
    width:100%;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    padding:12px 14px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    box-shadow: var(--shadow);
  }
  .nav button:active{ transform: translateY(1px); }
  .mark-read{
    background:var(--accent) !important;
    color:#fff !important;
    border-color:var(--accent) !important;
  }
  .mark-read.done{
    background:#4c7a52 !important;
    border-color:#4c7a52 !important;
  }

  .top-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .top-nav button{
    background:none;
    border:none;
    padding:4px 2px;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.2px;
    cursor:pointer;
  }
  .top-nav button:active{ opacity:0.7; }
  .top-nav .prevBtn{ color:#d0453a; }
  .top-nav .nextBtn{ color:var(--ink-soft); }

  .install-btn{
    display:block;
    margin:0 auto 18px;
    background:none;
    border:1px dashed var(--gold);
    color:var(--gold);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:12px;
    font-weight:700;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .install-btn:active{ opacity:0.7; }

  .dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:18px 0 6px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--line);
    cursor:pointer;
  }
  .dot.active{ background:var(--accent); }

  footer{
    text-align:center;
    margin-top:24px;
    font-size:12px;
    color:var(--ink-soft);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
</style>

<div class="wrap">

  <footer>Worry · Grace · Break — Fire Fellowship devotional series</footer>
</div>

<script>
const UI_TEXT = {
  en: { q: "Discussion Questions", prev: "← Prev", next: "Next →", mark: "Mark Read", done: "Read ✓", streak: (n) => `<b>${n}</b> day${n===1?'':'s'} read` },

};

const DEVOTIONALS = [
{
  id: "worry",

    ref: "Matthew 6:25-27, 34",

      "Jesus didn't say worry is understandable. He said stop.",
      "That “therefore” at the start isn't casual. He just finished telling his disciples you cannot serve two masters. A man who trusts God with his eternity but white-knuckles his rent, his job, his future — that man has a divided heart.",
      "Jesus asks a sharp question: Can worrying add a single hour to your life? The answer is no. It actually shortens it. Every man in this room knows what chronic anxiety does to the body, to sleep, to how you treat the people you love. Worry doesn't solve anything. It just taxes today for a debt that may never come due.",
      "Notice what Jesus points to: birds. Not successful men, not men who had it all figured out. Birds. The Father feeds them, and they don't have a 401k. He's not saying don't work, don't plan, don't be responsible. He's saying stop carrying what isn't yours to carry.",
      "The real issue isn't circumstances — it's trust. Most of our worry is a quiet belief that God might drop the ball. Jesus is calling that out directly.",

    questions: [

    ]
  },
  es: {
    ref: "Mateo 6:25-27, 34",
    verse: "“Por eso os digo: No os afanéis por vuestra vida… ¿Y quién de vosotros podrá, por mucho que se afane, añadir a su estatura un codo?… Basta a cada día su propio mal.”",
    title: "El Peso de la Ansiedad",
    body: [
      "Pablo no amaneció contento. Lo aprendió.",
      "Ese “por eso” al comienzo no es casual. Acabó de decirles a sus discípulos que nadie puede servir a dos señores. El hombre que confía a Dios su eternidad pero se aferra con los nudillos blancos a su sueldo, su trabajo, su futuro — ese hombre tiene el corazón dividido.",
      "Jesús hace una pregunta directa: ¿Puede alguien añadir una sola hora a su vida con preocupaciones? La respuesta es no. Al contrario, las acorta. Cada hombre en este grupo sabe lo que la ansiedad crónica le hace al cuerpo, al sueño, a cómo trata a los que ama.",
      "Fíjate en lo que señala Jesús: las aves. No hombres exitosos. Las aves. El Padre las alimenta y no tienen fondo de retiro. No está diciendo que no trabajes. Está diciendo que dejes de cargar lo que no te corresponde.",
      "El problema real no son las circunstancias — es la confianza. La mayoría de nuestras preocupaciones son una creencia silenciosa de que Dios podría fallar. Jesús está confrontando eso directamente.",
      "<strong>Hermanos, ¿qué estás cargando al entrar aquí hoy?</strong>",
      "Jesús dice: El mañana traerá su propio afán. No tienes que resolverlo esta noche. Tienes que confiar en Aquel que ya vive en ese mañana."

    questions: [
      "¿Cuál es la preocupación que más ocupa tu mente en este momento?",
      "¿De dónde viene tu ansiedad generalmente — miedo al fracaso, miedo a perder algo, o algo más?",
      "¿Cómo se vería, de manera práctica, entregar esa preocupación a Dios esta semana, en lugar de solo orar por ella?"
    ]
  },
  pt: {
    ref: "Mateus 6:25-27, 34",
    verse: "“Por isso vos digo: não vos preocupeis com a vossa vida… E qual de vós, por mais que se preocupe, pode acrescentar um só côvado à sua estatura?… A cada dia basta o seu mal.”",
    title: "O Peso da Ansiedade",
    body: [
      "Jesus não disse que a preocupação é compreensível. Disse que parem.",
      "Esse “por isso” no começo não é casual. Ele acabava de dizer aos seus discípulos que ninguém pode servir a dois senhores. O homem que confia a Deus a sua eternidade mas agarra com força o seu salário, o seu emprego, o seu futuro — esse homem tem o coração dividido.",
      "Jesus faz uma pergunta direta: Alguém pode acrescentar uma hora sequer à sua vida por meio da preocupação? A resposta é não. Ela na verdade a encurta. Todo homem neste grupo sabe o que a ansiedade crônica faz ao corpo, ao sono, à forma como trata as pessoas que ama.",
      "Repare no que Jesus aponta: os pássaros. Não homens bem-sucedidos. Os pássaros. O Pai os alimenta e eles não têm previdência privada. Ele não está dizendo para não trabalhar. Está dizendo para parar de carregar o que não é seu carregar.",
      "O problema real não são as circunstâncias — é a confiança. A maior parte da nossa preocupação é uma crença silenciosa de que Deus pode falhar. Jesus está confrontando isso diretamente.",
      "<strong>Irmãos, o que você está carregando ao entrar aqui hoje?</strong>",
      "Jesus diz: O amanhã cuidará de si mesmo. Você não precisa resolver isso esta noite. Você precisa confiar nAquele que já vive nesse amanhã."
    ],
    questions: [
      "Qual é a coisa que mais ocupa sua mente com preocupação agora?",
      "De onde vem a sua ansiedade geralmente — medo de fracassar, medo de perder algo, ou outra coisa?",
      "Como seria, na prática, entregar essa preocupação a Deus esta semana, em vez de só orar a respeito?"
    ]
  }
},
{
  id: "grace",
  en: {
    ref: "Ephesians 2:4–9",
    verse: "“But God, being rich in mercy, because of the great love with which he loved us, even when we were dead in our trespasses, made us alive together with Christ—by grace you have been saved… For by grace you have been saved through faith. And this is not your own doing; it is the gift of God, not a result of works, so that no one may boast.”",
    title: "The God Who Gives What We Don't Deserve",
    body: [
      "Grace is not a reward. It is a rescue.",

      "<strong>Brothers, stop trying to pay back what was never a loan.</strong>",
      "Grace received changes how you live — not to earn favor, but from it. The man who knows he has been rescued does not white-knuckle his religion. He walks differently."

    questions: [
      "Where in your life are you still trying to earn God's approval instead of living from it?",
      "How does knowing salvation is a gift — not a result of your effort — change how you handle your failures?",
      "What would it look like this week to live from grace rather than toward it?"
    ]
  },
  es: {
    ref: "Efesios 2:4–9",
    verse: "“Pero Dios, que es rico en misericordia, por su gran amor con que nos amó, aun estando nosotros muertos en pecados, nos dio vida juntamente con Cristo (por gracia soís salvos)… Porque por gracia soís salvos por medio de la fe; y esto no de vosotros, pues es don de Dios; no por obras, para que nadie se glorie.”",

    body: [
      "La gracia no es una recompensa. Es un rescate.",
      "La mayoría de los hombres están programados para ganarse las cosas. Nos ganamos el sueldo, la reputación, el lugar en la mesa. Entonces cuando escuchamos “Dios te ama,” instintivamente buscamos la letra pequeña: ¿qué tengo que hacer para mantenerlo? Pero eso no es gracia. Eso es una transacción.",

      "La palabra griega es charis — un regalo dado libremente sin expectativa de pago. No es tolerancia. No es que Dios baje el estándar. Es que Dios mismo cargó el peso total del estándar en Cristo y luego te entregó el resultado como regalo.",
      "Esto debería destruir tu orgullo y liberarte al mismo tiempo. No puedes presumir de tu posición delante de Dios porque tú no la construiste. Tampoco puedes perderla al fallar, porque no te la ganaste. Descansa completamente en lo que Cristo hizo — terminado, hecho, permanente.",
      "<strong>Hermanos, dejen de intentar pagar lo que jamás fue un préstamo.</strong>",
      "La gracia recibida cambia cómo vives — no para ganarte el favor, sino desde él. El hombre que sabe que fue rescatado no agarra su religión con los nudillos blancos. Camina diferente."

    questions: [

      "¿Cómo cambia saber que la salvación es un regalo — no el resultado de tu esfuerzo — la manera en que manejas tus fracasos?",
      "¿Cómo se vería esta semana vivir desde la gracia en lugar de vivir hacia ella?"
    ]
  },
  pt: {
    ref: "Efésios 2:4–9",
    verse: "“Mas Deus, que é rico em misericórdia, por causa do grande amor com que nos amou, mesmo estando nós mortos em nossos delitos, nos deu vida juntamente com Cristo — pela graça vós sois salvos… Porque pela graça sois salvos mediante a fé, e isso não vem de vós; é dom de Deus. Não vem das obras, para que ninguém se glorie.”",
    title: "O Deus que Dá o que Não Merecemos",
    body: [
      "A graça não é uma recompensa. É um resgate.",
      "A maioria dos homens é programada para conquistar. Conquistamos o salário, a reputação, o nosso lugar à mesa. Então, quando ouvimos “Deus te ama,” instintivamente procuramos as letras miúdas: o que preciso fazer para manter isso? Mas isso não é graça. Isso é uma transação.",
      "Paulo é direto: você estava morto. Mortos não cooperam com o próprio resgate. Não se limpam primeiro. Deus veio em nossa direção enquanto ainda estávamos na nossa bagunça — não depois de melhorar, não depois de ser consistentes, não depois de parar de falhar com as pessoas que amamos. Enquanto estávamos mortos.",

      "<strong>Irmãos, parem de tentar pagar o que nunca foi um empréstimo.</strong>",
      "A graça recebida muda como você vive — não para conquistar favor, mas a partir dele. O homem que sabe que foi resgatado não segura a religião com os nós dos dedos brancos. Ele caminha de forma diferente."

    questions: [
      "Em que área da sua vida você ainda está tentando conquistar a aprovação de Deus em vez de viver a partir dela?",
      "Como saber que a salvação é um presente — não resultado do seu esforço — muda a forma como você lida com os seus fracassos?",
      "Como seria, na prática, viver a partir da graça esta semana, em vez de viver em direção a ela?"
    ]
  }

let lang = 'en';
let idx = 0;
const STORAGE_KEY = 'sixty_seconds_read_days';

function getReadSet(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  }catch(e){ return new Set(); }
}
function saveReadSet(set){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); }catch(e){}
}

function render(){
  const d = DEVOTIONALS[idx][lang];
  const ui = UI_TEXT[lang];

  document.getElementById('refLine').textContent = d.ref;
  document.getElementById('verseLine').textContent = d.verse;
  document.getElementById('titleLine').textContent = d.title;

  const bodyEl = document.getElementById('bodyLines');
  bodyEl.innerHTML = d.body.map(p => `<p>${p}</p>`).join('');

  document.getElementById('qTitle').textContent = ui.q;
  const qList = document.getElementById('questionsList');
  qList.innerHTML = d.questions.map((q,i) => `
    <div class="q"><div class="num">${i+1}</div><div>${q}</div></div>
  `).join('');

  document.getElementById('prevBtn').textContent = ui.prev;
  document.getElementById('nextBtn').textContent = ui.next;

  // dots
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = DEVOTIONALS.map((_,i) =>
    `<div class="dot ${i===idx?'active':''}" data-i="${i}"></div>`
  ).join('');
  dotsEl.querySelectorAll('.dot').forEach(el=>{
    el.addEventListener('click', ()=>{ idx = parseInt(el.dataset.i); render(); });
  });

  // read state
  const readSet = getReadSet();
  const key = DEVOTIONALS[idx].id;
  const markBtn = document.getElementById('markBtn');
  if(readSet.has(key)){
    markBtn.textContent = ui.done;
    markBtn.classList.add('done');
  } else {
    markBtn.textContent = ui.mark;
    markBtn.classList.remove('done');
  }
  document.getElementById('streakLabel').innerHTML = ui.streak(readSet.size);
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  idx = (idx - 1 + DEVOTIONALS.length) % DEVOTIONALS.length;
  render();
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  idx = (idx + 1) % DEVOTIONALS.length;
  render();
});
document.getElementById('markBtn').addEventListener('click', ()=>{
  const readSet = getReadSet();
  const key = DEVOTIONALS[idx].id;
  if(readSet.has(key)) readSet.delete(key); else readSet.add(key);
  saveReadSet(readSet);
  render();
});
document.getElementById('langToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  lang = btn.dataset.lang;
  document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

// open on today's devotional (rotates through the set by day-of-year)
const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(),0,0)) / 86400000);
idx = dayOfYear % DEVOTIONALS.length;

render();

// register service worker for offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

// Android/Chrome "Add to Home Screen" prompt
let deferredInstallPrompt = null;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  installBtn.hidden = false;
});
installBtn.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installBtn.hidden = true;
});
window.addEventListener('appinstalled', () => { installBtn.hidden = true; });
</script>
